services:
  riviamigo:
    environment:
      RIVIAMIGO_OIDC_CLIENT_SECRET_FILE: /run/secrets/riviamigo-oidc-client-secret
    volumes:
      - type: bind
        source: ${RIVIAMIGO_OIDC_CLIENT_SECRET_SOURCE:?Set RIVIAMIGO_OIDC_CLIENT_SECRET_SOURCE to the host secret file}
        target: /run/secrets/riviamigo-oidc-client-secret
        read_only: true
        bind:
          create_host_path: false
