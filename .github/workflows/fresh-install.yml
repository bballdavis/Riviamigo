name: Fresh install

on:
  push:
    branches:
      - main
    paths:
      - 'compose/**'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/hooks/**'
      - 'packages/types/**'
      - 'scripts/check-compose-contracts.mjs'
      - 'scripts/validate-compose.mjs'
      - 'scripts/verify-fresh-install.mjs'
      - '.github/workflows/fresh-install.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Verification path
        required: true
        default: production
        type: choice
        options: [production, dev]

permissions:
  contents: read

env:
  NODE_VERSION: '24.18.0'

jobs:
  fresh-install:
    name: Fresh install acceptance
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Verify migration integrity
        run: node tools/migration-integrity.mjs
      - run: pnpm install --frozen-lockfile
      - name: Run isolated acceptance
        run: |
          fresh_env="$RUNNER_TEMP/fresh-install.env"
          cp compose/.env.example "$fresh_env"
          sed -i 's|DATABASE_URL=.*|DATABASE_URL=postgresql://riviamigo:fresh-install-password@timescaledb:5432/riviamigo|' "$fresh_env"
          sed -i 's|POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=fresh-install-password|' "$fresh_env"
          sed -i 's|REDIS_PASSWORD=.*|REDIS_PASSWORD=fresh-install-redis-password|' "$fresh_env"
          sed -i 's|ALLOWED_ORIGINS=.*|ALLOWED_ORIGINS=https://fresh-install.example.test|' "$fresh_env"
          sed -i 's|RIVIAMIGO_SETUP_TOKEN=.*|RIVIAMIGO_SETUP_TOKEN=fresh-install-setup-token-32-bytes-minimum|' "$fresh_env"
          printf '\nJWT_SECRET=%s\nJWT_PUBLIC_KEY=%s\nAGE_ENCRYPTION_KEY=%s\n' "${{ secrets.FRESH_INSTALL_JWT_SECRET }}" "${{ secrets.FRESH_INSTALL_JWT_PUBLIC_KEY }}" "${{ secrets.FRESH_INSTALL_AGE_ENCRYPTION_KEY }}" >> "$fresh_env"
          pnpm verify:fresh-install -- --mode "${{ inputs.mode || 'production' }}" --production-env "$fresh_env" --source-build
