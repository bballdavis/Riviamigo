name: Restore compatibility contracts

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24.18.0'
  PNPM_VERSION: '11.15.1'
  RUST_VERSION: '1.97.1'

jobs:
  contracts:
    name: Restore compatibility contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Detect restore-contract changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]] || ! git diff --quiet "$BASE_SHA" HEAD -- apps/api/migrations apps/api/src/bin/riviamigo-restore-agent.rs apps/api/src/services/backups.rs apps/api/src/services/restore_compatibility.rs apps/api/src/services/restore_jobs.rs scripts/restore-backup.mjs tools/restore-lab .github/workflows/restore-compatibility.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No restore-contract inputs changed; reporting a successful no-op."
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify migration integrity
        if: steps.changes.outputs.run == 'true'
        run: node tools/migration-integrity.mjs --base-ref "${GITHUB_BASE_SHA:-}"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: steps.changes.outputs.run == 'true'
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        if: steps.changes.outputs.run == 'true'
        with:
          workspaces: apps/api
      - name: Compile restore supervisor
        if: steps.changes.outputs.run == 'true'
        run: cargo check --manifest-path apps/api/Cargo.toml --bin riviamigo-restore-agent
      - name: Verify planner and package contracts
        if: steps.changes.outputs.run == 'true'
        run: |
          cargo test --manifest-path apps/api/Cargo.toml restore_compatibility::tests --lib
          cargo test --manifest-path apps/api/Cargo.toml backups::tests --lib
      - name: Verify host orchestration and lab syntax
        if: steps.changes.outputs.run == 'true'
        run: |
          node --check tools/migration-integrity.mjs
          node --check scripts/restore-backup.mjs
          node --check tools/restore-lab/run.mjs

  release-checkpoint:
    name: Restore release checkpoint
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore registered release checkpoint
        shell: pwsh
        run: pnpm verify:restore-compatibility -- --package $env:RIVIAMIGO_RESTORE_FIXTURE --source-build
